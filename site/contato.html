<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <title>Contato - Encontros que Transformam</title>
  </head>
  <body>
    <header class="topbar">
      <nav class="navbar container">
        <a class="logo" href="#">Encontros que Transformam</a>
        <button class="menu-toggle" type="button" aria-label="Abrir menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <ul class="nav-links">
          <li><a href="../index.html">Início</a></li>
          <li><a href="../sobre.html">Sobre</a></li>
          <li><a href="contato.html">Formulário</a></li>
        </ul>
      </nav>
    </header>

    <main class="main-content">
      <section class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-7">
            <div class="card shadow-sm border-0 form-card">
              <div class="card-body p-4 p-md-5">
                <h1 class="h3 mb-2">Entre em contato</h1>
                <p class="text-muted mb-4">Envie sua mensagem e participe das próximas oportunidades.</p>

                <form id="contactForm" class="row g-3 needs-validation" novalidate>
                  <div class="col-md-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nome" required>
                    <div class="invalid-feedback">Informe o seu nome.</div>
                  </div>

                  <div class="col-md-6">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" required>
                    <div class="invalid-feedback">Informe um e-mail válido.</div>
                  </div>

                  <div class="col-md-6">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="tel" class="form-control" id="telefone" required>
                    <div class="invalid-feedback">Informe um telefone válido.</div>
                  </div>

                  <div class="col-md-6">
                    <label for="cidade" class="form-label">Cidade</label>
                    <input type="text" class="form-control" id="cidade" required>
                    <div class="invalid-feedback">Informe a sua cidade.</div>
                  </div>

                  <div class="col-md-6">
                    <label for="escolaridade" class="form-label">Nível Acadêmico</label>
                    <select class="form-select" id="escolaridade" required>
                      <option value="" selected disabled>Escolha...</option>
                      <option value="Ensino Fundamental">Ensino Fundamental</option>
                      <option value="Ensino Médio">Ensino Médio</option>
                      <option value="Ensino Superior">Ensino Superior</option>
                      <option value="Pós-graduação">Pós-graduação</option>
                    </select>
                    <div class="invalid-feedback">Selecione a sua escolaridade.</div>
                  </div>

                  <div class="col-12">
                    <label for="mensagem" class="form-label">Escreva aqui, queremos saber qual é a sua expectativa para o próximo evento !</label>
                    <textarea class="form-control" id="mensagem" rows="4" required></textarea>
                    <div class="invalid-feedback">Escreva sua mensagem.</div>
                  </div>

                  <div class="col-12">
                    <button class="btn btn-primary px-4" type="submit">Enviar</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script.js"></script>
  </body>
</html>
