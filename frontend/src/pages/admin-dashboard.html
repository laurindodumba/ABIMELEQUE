<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <title>Painel de Controle - Encontros que Transformam</title>
</head>

<body>
  <header class="topbar">
    <nav class="navbar container">
      <div class="logo">
        <img src="../assets/logo/logo.png" alt="Logo">
      </div>
      <ul class="nav-links">
        <li><a href="#" id="logoutBtn">Sair</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-content">
    <section class="container py-5">
      <div class="row mb-4 align-items-center">
        <div class="col-md-6">
          <h1 class="h3 mb-0">Cadastros Recebidos</h1>
        </div>
        <div class="col-md-6 text-md-end mt-3 mt-md-0">
          <button class="btn btn-outline-primary" id="refreshBtn">
            Atualizar Lista
          </button>
        </div>
      </div>

      <!-- Stat Cards -->
      <div class="row g-3 mb-4">
        <div class="col-sm-4">
          <div class="stat-card">
            <div class="stat-icon">👥</div>
            <div class="stat-value" id="statTotal">—</div>
            <div class="stat-label">Total de Cadastros</div>
          </div>
        </div>
        <div class="col-sm-4">
          <div class="stat-card">
            <div class="stat-icon">🏙️</div>
            <div class="stat-value" id="statCidades">—</div>
            <div class="stat-label">Cidades Representadas</div>
          </div>
        </div>
        <div class="col-sm-4">
          <div class="stat-card">
            <div class="stat-icon">🕐</div>
            <div class="stat-value stat-value--sm" id="statUltimo">—</div>
            <div class="stat-label">Último Cadastro</div>
          </div>
        </div>
      </div>

      <div id="dashboardAlert" class="alert alert-danger d-none" role="alert"></div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover admin-table mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Nome</th>
                  <th scope="col">E-mail</th>
                  <th scope="col">Telefone</th>
                  <th scope="col">Cidade</th>
                  <th scope="col">Escolaridade</th>
                  <th scope="col">Mensagem</th>
                </tr>
              </thead>
              <tbody id="cadastrosTableBody">
                <tr>
                  <td colspan="7" class="text-center py-4 text-muted">A carregar dados...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../admin.js"></script>
</body>

</html>
