<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <title>Admin Login - Encontros que Transformam</title>
</head>

<body>
  <header class="topbar">
    <nav class="navbar container">
      <div class="logo">
        <img src="../assets/logo/logo.png" alt="Logo">
      </div>
      <ul class="nav-links-log">
        <a href="../index.html">Voltar ao Site</a>
      </ul>
    </nav>
  </header>

  <main class="main-content">
    <section class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
      <div class="col-lg-5 col-md-7">
        <div class="card shadow-sm border-0 form-card admin-card">
          <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-4 text-center">Acesso Restrito</h1>

            <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

            <form id="adminLoginForm" class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <input type="text" class="form-control" id="username" required>
                <div class="invalid-feedback">Informe o usuário.</div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" required>
                <div class="invalid-feedback">Informe a senha.</div>
              </div>

              <div class="d-grid">
                <button class="btn btn-primary-login btn-lg text-black" type="submit">Entrar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../admin.js"></script>
</body>

</html>
